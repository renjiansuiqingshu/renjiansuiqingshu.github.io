<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>外卖数据监测</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#5B7BA5;--primary-light:#8BAAC8;--bg:#F5F7FA;--card:#fff;--text:#2C3E50;--text-light:#8899AA;--border:#E8ECF0;--success:#52C41A;--danger:#FF4D4F;--warn:#FAAD14}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}

.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:var(--card);border-radius:16px;padding:32px 24px;width:100%;max-width:320px;box-shadow:0 2px 12px rgba(0,0,0,.08);text-align:center}
.login-box h2{font-size:20px;margin-bottom:8px;color:var(--primary)}
.login-box p{font-size:13px;color:var(--text-light);margin-bottom:24px}
.login-box input{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:8px;font-size:16px;outline:none;transition:border .2s}
.login-box input:focus{border-color:var(--primary)}
.login-box button{width:100%;margin-top:16px;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer}
.login-box button:active{background:var(--primary-light)}

.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-item{flex:1;text-align:center;padding:8px 0 6px;color:var(--text-light);font-size:11px;cursor:pointer}
.nav-item.active{color:var(--primary)}
.nav-item .icon{font-size:20px;display:block;margin-bottom:2px}

.page{display:none;padding:16px 16px 80px;max-width:480px;margin:0 auto}
.page.active{display:block}

.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.page-header h1{font-size:20px;font-weight:600}
.page-header .date{font-size:13px;color:var(--text-light)}

.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px}

.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi-item{background:var(--card);border-radius:10px;padding:12px;text-align:center}
.kpi-value{font-size:22px;font-weight:700;color:var(--primary)}
.kpi-value.danger{color:var(--danger)}
.kpi-value.success{color:var(--success)}
.kpi-label{font-size:11px;color:var(--text-light);margin-top:2px}

.form-group{margin-bottom:14px}
.form-label{font-size:13px;color:var(--text-light);margin-bottom:4px;display:block}
.form-row{display:flex;gap:10px}
.form-row .form-group{flex:1}
.form-input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:15px;outline:none;transition:border .2s;background:#fff}
.form-input:focus{border-color:var(--primary)}

.store-toggle{display:flex;background:var(--bg);border-radius:8px;padding:3px;margin-bottom:16px}
.store-toggle .tab{flex:1;text-align:center;padding:8px;border-radius:6px;font-size:14px;cursor:pointer;transition:all .2s}
.store-toggle .tab.active{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.1);font-weight:600;color:var(--primary)}

.btn-submit{width:100%;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
.btn-submit:active{background:var(--primary-light)}
.btn-submit:disabled{background:#ccc}

.chart-wrap{position:relative;height:200px;margin:8px 0}

.history-table{width:100%;border-collapse:collapse;font-size:12px}
.history-table th{text-align:left;padding:8px 6px;color:var(--text-light);font-weight:500;border-bottom:1px solid var(--border)}
.history-table td{padding:8px 6px;border-bottom:1px solid var(--border)}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:8px;font-size:14px;z-index:999;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}

.compare-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.compare-row:last-child{border:none}
.compare-bar{display:flex;align-items:center;gap:6px}
.compare-bar .bar{height:6px;border-radius:3px;min-width:4px}
.compare-bar .bar.a{background:var(--primary)}
.compare-bar .bar.b{background:var(--warn)}

.btn-sm{padding:4px 10px;border:none;border-radius:6px;font-size:12px;cursor:pointer}
.btn-edit{background:#E6F0FA;color:var(--primary)}
.btn-del{background:#FFF1F0;color:var(--danger)}

.empty{text-align:center;padding:40px 20px;color:var(--text-light)}
.empty .icon{font-size:48px;margin-bottom:12px}
</style>
</head>
<body>

<!-- Login -->
<div id="loginPage" class="login-wrap">
  <div class="login-box">
    <h2>🍪 外卖数据监测</h2>
    <p>请输入访问密码</p>
    <input type="password" id="pwdInput" placeholder="密码" autocomplete="off">
    <button onclick="doLogin()">进入</button>
  </div>
</div>

<!-- App -->
<div id="mainApp" style="display:none">
  <div id="pageDash" class="page active">
    <div class="page-header"><h1>数据看板</h1><span class="date" id="dashDate"></span></div>
    <div class="store-toggle"><div class="tab active" onclick="switchDashStore(0)">店1</div><div class="tab" onclick="switchDashStore(1)">店2</div></div>
    <div id="dashKpi" class="kpi-grid"></div>
    <div class="card"><div class="card-title">营业额趋势</div><div class="chart-wrap"><canvas id="chartRevenue"></canvas></div></div>
    <div class="card"><div class="card-title">订单量趋势</div><div class="chart-wrap"><canvas id="chartOrders"></canvas></div></div>
    <div class="card"><div class="card-title">两店对比（近7日）</div><div id="compareSection"></div></div>
  </div>

  <div id="pageEntry" class="page">
    <div class="page-header"><h1>数据录入</h1></div>
    <div class="store-toggle" id="entryStoreToggle"><div class="tab active" onclick="switchEntryStore(0)">店1</div><div class="tab" onclick="switchEntryStore(1)">店2</div></div>
    <div class="card">
      <div class="form-group"><label class="form-label">日期</label><input type="date" class="form-input" id="entryDate"></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">曝光量</label><input type="number" class="form-input" id="f_impressions" placeholder="0"></div>
        <div class="form-group"><label class="form-label">进店人数</label><input type="number" class="form-input" id="f_visitors" placeholder="0"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">下单人数</label><input type="number" class="form-input" id="f_buyers" placeholder="0"></div>
        <div class="form-group"><label class="form-label">订单量</label><input type="number" class="form-input" id="f_orderCount" placeholder="0"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">营业额（元）</label><input type="number" step="0.01" class="form-input" id="f_revenue" placeholder="0.00"></div>
        <div class="form-group"><label class="form-label">实收（元）</label><input type="number" step="0.01" class="form-input" id="f_actualIncome" placeholder="0.00"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">平台抽成（元）</label><input type="number" step="0.01" class="form-input" id="f_commission" placeholder="0.00"></div>
        <div class="form-group"><label class="form-label">活动支出（元）</label><input type="number" step="0.01" class="form-input" id="f_promoCost" placeholder="0.00"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">好评数</label><input type="number" class="form-input" id="f_goodReviews" placeholder="0"></div>
        <div class="form-group"><label class="form-label">差评数</label><input type="number" class="form-input" id="f_badReviews" placeholder="0"></div>
      </div>
      <button class="btn-submit" id="btnSubmit" onclick="submitEntry()">提交数据</button>
    </div>
  </div>

  <div id="pageHistory" class="page">
    <div class="page-header"><h1>历史记录</h1></div>
    <div class="store-toggle" id="histStoreToggle"><div class="tab active" onclick="switchHistStore(0)">店1</div><div class="tab" onclick="switchHistStore(1)">店2</div></div>
    <div id="histContent"></div>
  </div>

  <div id="pageSettings" class="page">
    <div class="page-header"><h1>设置</h1></div>
    <div class="card">
      <div class="card-title">店铺名称</div>
      <div class="form-group"><label class="form-label">店1名称</label><input type="text" class="form-input" id="s_store0Name" placeholder="店1"></div>
      <div class="form-group"><label class="form-label">店2名称</label><input type="text" class="form-input" id="s_store1Name" placeholder="店2"></div>
      <button class="btn-submit" onclick="saveStoreNames()">保存</button>
    </div>
    <div class="card">
      <div class="card-title">修改密码</div>
      <div class="form-group"><label class="form-label">新密码</label><input type="password" class="form-input" id="s_newPwd" placeholder="输入新密码"></div>
      <button class="btn-submit" onclick="changePassword()">修改密码</button>
    </div>
    <div class="card">
      <div class="card-title">数据管理</div>
      <button class="btn-submit" onclick="exportData()" style="background:var(--primary-light)">导出数据（JSON）</button>
      <div style="height:8px"></div>
      <label class="btn-submit" style="background:var(--primary-light);display:block;text-align:center;cursor:pointer">
        导入数据
        <input type="file" accept=".json" onchange="importData(event)" style="display:none">
      </label>
      <div style="height:8px"></div>
      <button class="btn-submit" onclick="if(confirm('确定清空所有数据？不可恢复！'))clearAllData()" style="background:var(--danger)">清空数据</button>
    </div>
  </div>

  <div class="nav">
    <div class="nav-item active" onclick="switchPage('pageDash')"><span class="icon">📊</span>看板</div>
    <div class="nav-item" onclick="switchPage('pageEntry')"><span class="icon">✏️</span>录入</div>
    <div class="nav-item" onclick="switchPage('pageHistory')"><span class="icon">📋</span>记录</div>
    <div class="nav-item" onclick="switchPage('pageSettings')"><span class="icon">⚙️</span>设置</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ STORAGE ============
const SK_PWD = 'wm_pwd', SK_DATA = 'wm_data', SK_NAMES = 'wm_names';
let storeNames = ['淘宝闪购','美团外卖'];
let currentDashStore=0, currentEntryStore=0, currentHistStore=0;
let chartRevenue=null, chartOrders=null;
let editingId=null;

function loadData(){ return JSON.parse(localStorage.getItem(SK_DATA)||'[]'); }
function saveData(d){ localStorage.setItem(SK_DATA, JSON.stringify(d)); }
function loadNames(){ const n=JSON.parse(localStorage.getItem(SK_NAMES)||'null'); if(n) storeNames=n; updateStoreLabels(); }
function saveNames(){ localStorage.setItem(SK_NAMES, JSON.stringify(storeNames)); }

// ============ LOGIN ============
function doLogin(){
  const pwd=document.getElementById('pwdInput').value.trim();
  if(!pwd){showToast('请输入密码');return;}
  const saved=localStorage.getItem(SK_PWD);
  if(!saved){
    localStorage.setItem(SK_PWD,pwd);
    enterApp();
    showToast('密码已设置');
  } else if(pwd===saved){
    enterApp();
  } else {
    showToast('密码错误');
  }
}
function enterApp(){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('mainApp').style.display='block';
  initApp();
}
function checkAuth(){
  const saved=localStorage.getItem(SK_PWD);
  if(sessionStorage.getItem('wm_authed')==='1' || !saved){
    if(!saved || sessionStorage.getItem('wm_authed')==='1'){
      if(!saved){/* first time, show login */}
      else{enterApp();}
    }
  }
}
document.getElementById('pwdInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

// Auto-login if already authed this session
(function(){
  if(sessionStorage.getItem('wm_authed')==='1'){
    document.getElementById('loginPage').style.display='none';
    document.getElementById('mainApp').style.display='block';
    loadNames();
    initApp();
  }
})();

function enterApp(){
  sessionStorage.setItem('wm_authed','1');
  document.getElementById('loginPage').style.display='none';
  document.getElementById('mainApp').style.display='block';
  loadNames();
  initApp();
}

// ============ APP ============
function initApp(){
  document.getElementById('entryDate').value=today();
  document.getElementById('dashDate').textContent=today();
  loadDashboard();
}

function today(){ return new Date().toISOString().split('T')[0]; }
function fmtDate(d){ if(typeof d==='string') return d; const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; }

// ============ NAV ============
function switchPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-item').forEach((n,i)=>n.classList.toggle('active',['pageDash','pageEntry','pageHistory','pageSettings'][i]===id));
  if(id==='pageDash') loadDashboard();
  if(id==='pageHistory') loadHistory();
  if(id==='pageSettings') loadSettingsForm();
}

function switchDashStore(i){currentDashStore=i;document.querySelectorAll('#pageDash .store-toggle .tab').forEach((t,idx)=>t.classList.toggle('active',idx===i));loadDashboard();}
function switchEntryStore(i){currentEntryStore=i;document.querySelectorAll('#entryStoreToggle .tab').forEach((t,idx)=>t.classList.toggle('active',idx===i));editingId=null;document.getElementById('btnSubmit').textContent='提交数据';clearForm();}
function switchHistStore(i){currentHistStore=i;document.querySelectorAll('#histStoreToggle .tab').forEach((t,idx)=>t.classList.toggle('active',idx===i));loadHistory();}

function updateStoreLabels(){
  document.querySelectorAll('.store-toggle').forEach(t=>{const tabs=t.querySelectorAll('.tab');tabs[0].textContent=storeNames[0];tabs[1].textContent=storeNames[1];});
}

// ============ DASHBOARD ============
function loadDashboard(){
  const all=loadData().filter(d=>d.storeIndex===currentDashStore).sort((a,b)=>a.date.localeCompare(b.date));
  const last7=all.slice(-7);
  const todayData=all.find(d=>d.date===today());
  renderKpi(todayData);
  renderCharts(last7);
  renderComparison(all.slice(-7));
}

function renderKpi(d){
  const el=document.getElementById('dashKpi');
  if(!d){el.innerHTML='<div class="kpi-item" style="grid-column:span 2"><div class="kpi-value" style="font-size:14px;color:var(--text-light)">今日暂无数据</div><div class="kpi-label">快去录入吧</div></div>';return;}
  const conv=d.visitors>0?((d.buyers/d.visitors)*100).toFixed(1):'-';
  const avg=d.orderCount>0?(d.actualIncome/d.orderCount).toFixed(1):'-';
  const gr=(d.goodReviews+d.badReviews)>0?((d.goodReviews/(d.goodReviews+d.badReviews))*100).toFixed(1)+'%':'-';
  el.innerHTML=`
    <div class="kpi-item"><div class="kpi-value">${d.orderCount}</div><div class="kpi-label">订单量</div></div>
    <div class="kpi-item"><div class="kpi-value success">¥${d.actualIncome}</div><div class="kpi-label">实收</div></div>
    <div class="kpi-item"><div class="kpi-value">¥${avg}</div><div class="kpi-label">客单价</div></div>
    <div class="kpi-item"><div class="kpi-value">${conv}%</div><div class="kpi-label">转化率</div></div>
    <div class="kpi-item"><div class="kpi-value">${d.visitors}</div><div class="kpi-label">进店人数</div></div>
    <div class="kpi-item"><div class="kpi-value">${gr}</div><div class="kpi-label">好评率</div></div>`;
}

function renderCharts(data){
  const labels=data.map(d=>d.date.slice(5));
  const rev=data.map(d=>d.actualIncome||0);
  const ord=data.map(d=>d.orderCount||0);
  if(chartRevenue) chartRevenue.destroy();
  if(chartOrders) chartOrders.destroy();
  const opts={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{grid:{color:'#f0f0f0'},ticks:{font:{size:10}},beginAtZero:true}}};
  chartRevenue=new Chart(document.getElementById('chartRevenue'),{type:'line',data:{labels,datasets:[{data:rev,borderColor:'#5B7BA5',backgroundColor:'rgba(91,123,165,0.1)',fill:true,tension:.3,pointRadius:3}]},options:opts});
  chartOrders=new Chart(document.getElementById('chartOrders'),{type:'bar',data:{labels,datasets:[{data:ord,backgroundColor:'rgba(91,123,165,0.6)',borderRadius:4}]},options:opts});
}

function renderComparison(data){
  const el=document.getElementById('compareSection');
  const all=loadData();
  const d0=all.filter(d=>d.storeIndex===0).slice(-7);
  const d1=all.filter(d=>d.storeIndex===1).slice(-7);
  const sum=(arr,k)=>arr.reduce((s,d)=>s+(d[k]||0),0);
  const metrics=[{label:'营业额',key:'revenue'},{label:'实收',key:'actualIncome'},{label:'订单量',key:'orderCount'},{label:'进店人数',key:'visitors'}];
  let html=`<div style="display:flex;justify-content:flex-end;gap:20px;margin-bottom:8px;font-size:11px;color:var(--text-light)"><span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--primary);margin-right:4px"></span>${storeNames[0]}</span><span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:4px"></span>${storeNames[1]}</span></div>`;
  metrics.forEach(m=>{
    const v0=sum(d0,m.key),v1=sum(d1,m.key),max=Math.max(v0,v1,1);
    const isMoney=m.key.includes('Income')||m.key==='revenue';
    html+=`<div class="compare-row"><span style="width:60px;font-size:12px;color:var(--text-light)">${m.label}</span><div class="compare-bar"><div class="bar a" style="width:${v0/max*100}px"></div><span style="font-size:12px;min-width:40px">${isMoney?'¥'+v0:v0}</span></div><div class="compare-bar"><div class="bar b" style="width:${v1/max*100}px"></div><span style="font-size:12px;min-width:40px">${isMoney?'¥'+v1:v1}</span></div></div>`;
  });
  el.innerHTML=html;
}

// ============ ENTRY ============
function submitEntry(){
  const date=document.getElementById('entryDate').value;
  if(!date){showToast('请选择日期');return;}
  const record={
    id: editingId || Date.now().toString(),
    storeIndex:currentEntryStore,
    date,
    impressions:Number(document.getElementById('f_impressions').value)||0,
    visitors:Number(document.getElementById('f_visitors').value)||0,
    buyers:Number(document.getElementById('f_buyers').value)||0,
    orderCount:Number(document.getElementById('f_orderCount').value)||0,
    revenue:Number(Number(document.getElementById('f_revenue').value).toFixed(2))||0,
    actualIncome:Number(Number(document.getElementById('f_actualIncome').value).toFixed(2))||0,
    commission:Number(Number(document.getElementById('f_commission').value).toFixed(2))||0,
    promoCost:Number(Number(document.getElementById('f_promoCost').value).toFixed(2))||0,
    goodReviews:Number(document.getElementById('f_goodReviews').value)||0,
    badReviews:Number(document.getElementById('f_badReviews').value)||0,
  };
  let data=loadData();
  if(editingId){
    const idx=data.findIndex(d=>d.id===editingId);
    if(idx>=0) data[idx]=record;
    editingId=null;
    document.getElementById('btnSubmit').textContent='提交数据';
    showToast('更新成功');
  } else {
    const exist=data.findIndex(d=>d.storeIndex===currentEntryStore && d.date===date);
    if(exist>=0){
      if(confirm('该日期已有数据，是否覆盖？')){data[exist]=record;showToast('覆盖成功');}
      else return;
    } else {
      data.push(record);
      showToast('录入成功');
    }
  }
  saveData(data);
  clearForm();
  document.getElementById('entryDate').value=today();
}

function clearForm(){['f_impressions','f_visitors','f_buyers','f_orderCount','f_revenue','f_actualIncome','f_commission','f_promoCost','f_goodReviews','f_badReviews'].forEach(id=>{document.getElementById(id).value='';});}

// ============ HISTORY ============
function loadHistory(){
  const data=loadData().filter(d=>d.storeIndex===currentHistStore).sort((a,b)=>b.date.localeCompare(a.date));
  const el=document.getElementById('histContent');
  if(!data.length){el.innerHTML='<div class="empty"><div class="icon">📭</div><div>暂无数据</div></div>';return;}
  let html='<table class="history-table"><thead><tr><th>日期</th><th>订单</th><th>实收</th><th>客单价</th><th>操作</th></tr></thead><tbody>';
  data.forEach(d=>{
    const avg=d.orderCount>0?'¥'+(d.actualIncome/d.orderCount).toFixed(1):'-';
    html+=`<tr><td>${d.date.slice(5)}</td><td>${d.orderCount}</td><td>¥${d.actualIncome}</td><td>${avg}</td><td><button class="btn-sm btn-edit" onclick="editRecord('${d.id}')">编辑</button> <button class="btn-sm btn-del" onclick="delRecord('${d.id}')">删</button></td></tr>`;
  });
  html+='</tbody></table>';
  el.innerHTML=html;
}

function editRecord(id){
  const d=loadData().find(r=>r.id===id);
  if(!d){showToast('数据不存在');return;}
  editingId=id;
  currentEntryStore=d.storeIndex;
  switchEntryStore(d.storeIndex);
  switchPage('pageEntry');
  document.getElementById('entryDate').value=d.date;
  document.getElementById('f_impressions').value=d.impressions||'';
  document.getElementById('f_visitors').value=d.visitors||'';
  document.getElementById('f_buyers').value=d.buyers||'';
  document.getElementById('f_orderCount').value=d.orderCount||'';
  document.getElementById('f_revenue').value=d.revenue||'';
  document.getElementById('f_actualIncome').value=d.actualIncome||'';
  document.getElementById('f_commission').value=d.commission||'';
  document.getElementById('f_promoCost').value=d.promoCost||'';
  document.getElementById('f_goodReviews').value=d.goodReviews||'';
  document.getElementById('f_badReviews').value=d.badReviews||'';
  document.getElementById('btnSubmit').textContent='更新数据';
}

function delRecord(id){
  if(!confirm('确定删除？'))return;
  let data=loadData().filter(d=>d.id!==id);
  saveData(data);
  showToast('已删除');
  loadHistory();
}

// ============ SETTINGS ============
function loadSettingsForm(){
  document.getElementById('s_store0Name').value=storeNames[0];
  document.getElementById('s_store1Name').value=storeNames[1];
}
function saveStoreNames(){
  storeNames[0]=document.getElementById('s_store0Name').value.trim()||'淘宝闪购';
  storeNames[1]=document.getElementById('s_store1Name').value.trim()||'美团外卖';
  saveNames();
  updateStoreLabels();
  showToast('保存成功');
}
function changePassword(){
  const p=document.getElementById('s_newPwd').value.trim();
  if(!p){showToast('请输入新密码');return;}
  localStorage.setItem(SK_PWD,p);
  document.getElementById('s_newPwd').value='';
  showToast('密码已修改');
}
function exportData(){
  const data=loadData();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='外卖数据_'+today()+'.json';
  a.click();
}
function importData(e){
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const imported=JSON.parse(ev.target.result);
      if(!Array.isArray(imported)){showToast('格式错误');return;}
      const existing=loadData();
      const merged=[...existing,...imported];
      saveData(merged);
      showToast('导入成功，共'+imported.length+'条');
      loadDashboard();
    }catch(err){showToast('文件解析失败');}
  };
  reader.readAsText(file);
}
function clearAllData(){
  localStorage.removeItem(SK_DATA);
  showToast('已清空');
}

// ============ UTILS ============
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
</script>
