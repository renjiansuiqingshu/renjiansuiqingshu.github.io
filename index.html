<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人间碎情书 · 树洞</title>
  <link rel="stylesheet" href="style.css?v=2026060321">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕊️</text></svg>">
</head>
<body>
  <!-- 顶部 -->
  <nav class="navbar">
    <div class="nav-brand">人间碎情书</div>
    <div class="nav-actions">
      <button class="btn-icon" id="themeToggle" title="切换主题">
        <span class="icon-light">☀</span>
        <span class="icon-dark">☾</span>
      </button>
      <button class="btn-icon" id="adminBtn" title="管理后台" style="display:none">✦</button>
    </div>
  </nav>

  <!-- 主内容 -->
  <main class="container">
    <header class="hero">
      <div class="hero-line"></div>
      <h1 class="title">树 洞</h1>
      <p class="subtitle">把心事说给风听，风会替你保管</p>
      <div class="stats">
        <span><strong id="totalCount">0</strong> 封匿名信</span>
        <span class="stats-dot">·</span>
        <span>今日 <strong id="todayCount">0</strong> 封</span>
      </div>
      <div class="hero-line"></div>
    </header>

    <section class="compose-box">
      <div class="compose-inner">
        <textarea id="secretInput" placeholder="写一封不会被拆开的信..." maxlength="2000"></textarea>
        <div class="char-count"><span id="charCount">0</span>/2000</div>
        <div class="privacy-hint">匿名投递，无人知晓</div>
        <div class="image-upload-area" id="imageUploadArea" style="display:none">
          <div class="image-preview" id="imagePreview">
            <img id="previewImg" src="" alt="">
            <button class="btn-remove-img" id="removeImg">✕</button>
          </div>
        </div>
        <div class="compose-actions">
          <div class="compose-left">
            <select id="categorySelect">
              <option value="随想">随想</option>
              <option value="心动">心动</option>
              <option value="难过">难过</option>
              <option value="愤怒">愤怒</option>
              <option value="深夜">深夜</option>
              <option value="开心">开心</option>
            </select>
            <button class="btn-icon" id="addImageBtn" title="添加图片">⊞</button>
            <input type="file" id="imageInput" accept="image/*" style="display:none">
          </div>
          <button class="btn-submit" id="submitBtn">投递</button>
        </div>
      </div>
    </section>

    <section class="filter-bar">
      <div class="category-bar">
        <button class="cat-btn active" data-cat="全部">全部</button>
        <button class="cat-btn" data-cat="随想">随想</button>
        <button class="cat-btn" data-cat="心动">心动</button>
        <button class="cat-btn" data-cat="难过">难过</button>
        <button class="cat-btn" data-cat="愤怒">愤怒</button>
        <button class="cat-btn" data-cat="深夜">深夜</button>
        <button class="cat-btn" data-cat="开心">开心</button>
      </div>
      <div class="sort-bar">
        <button class="sort-btn active" data-sort="latest">最新</button>
        <span class="sort-divider">|</span>
        <button class="sort-btn" data-sort="hot">热门</button>
      </div>
    </section>

    <section class="posts-list" id="postsList">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🕊️</div>
        <p>还没有人来过，写第一封吧</p>
      </div>
    </section>

    <div class="load-more" id="loadMore" style="display:none">
      <button class="btn-load-more" id="loadMoreBtn">再翻一页</button>
    </div>
  </main>

  <div class="modal-overlay" id="postModal" style="display:none">
    <div class="modal-content">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="modal-overlay" id="adminModal" style="display:none">
    <div class="modal-content modal-large">
      <button class="modal-close" id="adminModalClose">✕</button>
      <h2 class="modal-title">管理后台</h2>
      <div class="admin-tabs">
        <button class="admin-tab active" data-tab="reports">举报处理</button>
        <button class="admin-tab" data-tab="posts">内容管理</button>
      </div>
      <div class="admin-body" id="adminBody"></div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <!-- 腾讯云开发 SDK -->
  <script src="cloudbase.full.js"></script>
  <script src="app.js?v=2026060304"></script>
</body>
</html>
