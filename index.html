<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人间碎情书 · 树洞</title>
  <link rel="stylesheet" href="style.css?v=2026060322">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕊️</text></svg>">
</head>
<body>

  <!-- 顶部栏 -->
  <nav class="topbar">
    <div class="topbar-inner">
      <span class="logo">人间碎情书</span>
      <div class="topbar-right">
        <button class="topbar-btn" id="themeToggle" title="切换主题">
          <span class="icon-sun">☀</span>
          <span class="icon-moon">☾</span>
        </button>
        <button class="topbar-btn" id="adminBtn" title="管理" style="display:none">✦</button>
      </div>
    </div>
  </nav>

  <main class="page">

    <!-- 模块1: 问候区 -->
    <section class="greeting-section">
      <div class="greeting-text">
        <h1 class="greeting-title">树洞</h1>
        <p class="greeting-sub">把心事说给风听，风会替你保管</p>
      </div>
      <div class="greeting-stats">
        <div class="stat-chip">
          <span class="stat-num" id="totalCount">0</span>
          <span class="stat-label">封信</span>
        </div>
        <div class="stat-chip">
          <span class="stat-num" id="todayCount">0</span>
          <span class="stat-label">今日</span>
        </div>
      </div>
    </section>

    <!-- 模块2: 投递区 -->
    <section class="compose-section">
      <div class="compose-card">
        <textarea id="secretInput" placeholder="写一封不会被拆开的信..." maxlength="2000" rows="4"></textarea>
        <div class="image-upload-area" id="imageUploadArea" style="display:none">
          <div class="image-preview" id="imagePreview">
            <img id="previewImg" src="" alt="">
            <button class="btn-remove-img" id="removeImg">✕</button>
          </div>
        </div>
        <div class="compose-footer">
          <div class="compose-options">
            <div class="select-wrap">
              <select id="categorySelect">
                <option value="随想">💭 随想</option>
                <option value="心动">💗 心动</option>
                <option value="难过">😢 难过</option>
                <option value="愤怒">😡 愤怒</option>
                <option value="深夜">🌙 深夜</option>
                <option value="开心">😄 开心</option>
              </select>
            </div>
            <button class="option-btn" id="addImageBtn" title="添加图片">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
            </button>
            <input type="file" id="imageInput" accept="image/*" style="display:none">
            <span class="char-count"><span id="charCount">0</span>/2000</span>
          </div>
          <button class="btn-send" id="submitBtn">
            <span>投递</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="m22 2-7 20-4-9-9-4z"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- 模块3: 筛选栏 -->
    <section class="filter-section">
      <div class="filter-scroll">
        <button class="filter-chip active" data-cat="全部">全部</button>
        <button class="filter-chip" data-cat="随想">💭 随想</button>
        <button class="filter-chip" data-cat="心动">💗 心动</button>
        <button class="filter-chip" data-cat="难过">😢 难过</button>
        <button class="filter-chip" data-cat="愤怒">😡 愤怒</button>
        <button class="filter-chip" data-cat="深夜">🌙 深夜</button>
        <button class="filter-chip" data-cat="开心">😄 开心</button>
      </div>
      <div class="sort-group">
        <button class="sort-chip active" data-sort="latest">最新</button>
        <button class="sort-chip" data-sort="hot">热门</button>
      </div>
    </section>

    <!-- 模块4: 信件列表 -->
    <section class="posts-section">
      <div class="posts-list" id="postsList">
        <div class="empty-state" id="emptyState">
          <div class="empty-illustration">
            <svg width="64" height="64" viewBox="0 0 80 80" fill="none">
              <circle cx="40" cy="40" r="36" fill="currentColor" opacity="0.06"/>
              <path d="M28 34c0-2 1.5-3.5 3.5-3.5h17c2 0 3.5 1.5 3.5 3.5v14c0 2-1.5 3.5-3.5 3.5h-17C29.5 51.5 28 50 28 48V34z" fill="currentColor" opacity="0.12"/>
              <path d="M32 38h16M32 43h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.2"/>
            </svg>
          </div>
          <p class="empty-text">还没有人来过</p>
          <p class="empty-hint">写第一封信吧</p>
        </div>
      </div>
    </section>

    <!-- 加载更多 -->
    <div class="load-more-wrap" id="loadMore" style="display:none">
      <button class="btn-loadmore" id="loadMoreBtn">再翻一页</button>
    </div>

  </main>

  <!-- 信件详情弹窗 -->
  <div class="modal-overlay" id="postModal" style="display:none">
    <div class="modal-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-body" id="modalBody"></div>
    </div>
  </div>

  <!-- 管理弹窗 -->
  <div class="modal-overlay" id="adminModal" style="display:none">
    <div class="modal-sheet modal-sheet-lg">
      <div class="sheet-handle"></div>
      <div class="sheet-body">
        <h2 class="admin-title">管理后台</h2>
        <div class="admin-tabs">
          <button class="admin-tab active" data-tab="reports">举报处理</button>
          <button class="admin-tab" data-tab="posts">内容管理</button>
        </div>
        <div class="admin-body" id="adminBody"></div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="cloudbase.full.js"></script>
  <script src="app.js?v=2026060322"></script>
</body>
</html>
